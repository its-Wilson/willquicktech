<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #007bff; color: white; padding: 20px; text-align: center; }
        section { padding: 20px; }
        footer { background: #333; color: white; text-align: center; padding: 10px; }
        form { max-width: 600px; margin: auto; }
    </style>
</head>
<body>
    <header>
        <h1>Contact</h1>
        <nav>
            <a href="index.html" style="color: white; margin: 0 10px;">Home</a>
            <a href="about.html" style="color: white; margin: 0 10px;">About</a>
            <a href="services.html" style="color: white; margin: 0 10px;">Services</a>
            <a href="portfolio.html" style="color: white; margin: 0 10px;">Portfolio</a>
            <a href="blog.html" style="color: white; margin: 0 10px;">Blog</a>
            <a href="contact.html" style="color: white; margin: 0 10px;">Contact</a>
        </nav>
    </header>
    <section>
        <h2>Get in Touch</h2>
        <form>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message"></textarea><br>
            <input type="submit" value="Send">
        </form>
        <p>Email: your.email@example.com | Phone: (123) 456-7890</p>
    </section>
    <footer>
        <p>&copy; 2025 Your Name. All rights reserved.</p>
    </footer>
</body>
</html>
