name: ASH Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install ASH v3
        run: pip install git+https://github.com/awslabs/automated-security-helper.git@v3.1.2

      - name: Run ASH scan
        run: ash --mode local

      - name: Upload ASH results
        uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: ash-results
          path: .ash/ash_output/
