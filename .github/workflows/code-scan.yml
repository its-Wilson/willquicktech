name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Define the languages present in your repository
        language: [ 'javascript-typescript', 'python', 'go' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL Engine
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Recommended: Use 'security-extended' or 'security-and-quality' for deeper rules
          queries: security-extended

      # Autobuild handles compiled languages like Java, C#, or C/C++ automatically
      - name: Autobuild Codebase
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
